<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account &amp; Register - INAAM Portal</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #0b1120;
            --card-bg: #151f32;
            --card-border: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --success: #10b981;
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2.5rem 1.5rem;
            position: relative;
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* Watermark INAAM (Requirement 9) */
        .watermark-bg {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-30deg);
            font-size: 16vw;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.025);
            letter-spacing: 20px;
            pointer-events: none;
            z-index: 0;
            user-select: none;
            white-space: nowrap;
            text-transform: uppercase;
        }

        .register-container {
            width: 100%;
            max-width: 640px;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 1;
        }

        .header-title {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header-title h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(to right, #ffffff, var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.4rem;
        }

        .header-title p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.2rem;
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .register-container {
                padding: 1.8rem 1.2rem;
            }
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            margin-bottom: 0.45rem;
            font-size: 0.88rem;
            color: #cbd5e1;
            font-weight: 500;
        }

        input, select {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            background-color: #0b1120;
            color: #ffffff;
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.18);
        }

        select {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2338bdf8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 1.1em;
            padding-right: 2.5rem;
        }

        .btn-submit {
            width: 100%;
            padding: 0.95rem;
            background: linear-gradient(135deg, var(--primary), #6366f1);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4);
            margin-top: 1rem;
            transition: all 0.2s ease;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            opacity: 0.95;
        }

        .bottom-links {
            text-align: center;
            margin-top: 1.8rem;
            padding-top: 1.2rem;
            border-top: 1px solid var(--card-border);
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .bottom-links a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
        }

        .success-box {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.15), rgba(56, 189, 248, 0.1));
            border: 1px solid var(--success);
            border-radius: 14px;
            padding: 2rem;
            text-align: center;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="watermark-bg">INAAM</div>

    <div class="register-container" id="registerFormContainer">
        
        <div class="header-title">
            <h1>Create Account</h1>
            <p>Join INAAM Web Portal &bull; Set up your developer profile</p>
        </div>

        <form action="register.php" method="POST" onsubmit="handleRegisterSubmit(event)">
            <div class="form-grid">
                
                <!-- 1. Full Name -->
                <div class="form-group">
                    <label>Full Name *</label>
                    <input type="text" name="name" placeholder="e.g. John Doe" required>
                </div>

                <!-- 2. Email Address -->
                <div class="form-group">
                    <label>Email Address *</label>
                    <input type="email" name="email" placeholder="name@example.com" required>
                </div>

                <!-- 3. Password -->
                <div class="form-group">
                    <label>Password *</label>
                    <input type="password" name="password" placeholder="Create strong password" required minlength="4">
                </div>

                <!-- 4. Contact Number (Requirement 13) -->
                <div class="form-group">
                    <label>Contact No (Phone) *</label>
                    <input type="tel" name="contact_no" placeholder="e.g. +91 9876543210" required>
                </div>

                <!-- 5. Role Selection (Requirement 11, 12, 13, 15) -->
                <div class="form-group">
                    <label>Your Role *</label>
                    <select name="role" required>
                        <option value="Web Developer">Web Developer</option>
                        <option value="Web Programming">Web Programming</option>
                        <option value="Fresher">Fresher</option>
                    </select>
                </div>

                <!-- 6. Qualification (Requirement 13) -->
                <div class="form-group">
                    <label>Qualification *</label>
                    <select name="qualification" required>
                        <option value="BCA">BCA (Bachelor of Computer Applications)</option>
                        <option value="12th">12th Standard</option>
                        <option value="11th">11th Standard</option>
                        <option value="10th">10th Standard</option>
                        <option value="B.Tech">B.Tech / B.E.</option>
                        <option value="MCA">MCA / M.Sc</option>
                        <option value="Graduate">Other Graduate</option>
                    </select>
                </div>

                <!-- 7. Parentage (Requirement 13) -->
                <div class="form-group">
                    <label>Parentage (Father / Guardian) *</label>
                    <input type="text" name="parentage" placeholder="Father or Guardian Name" required>
                </div>

                <!-- 8. Course Enrolled (Requirement 13) -->
                <div class="form-group">
                    <label>Course Enrolled *</label>
                    <input type="text" name="course_enrolled" placeholder="e.g. BCA or Full Stack Web Development" required value="BCA">
                </div>

                <!-- 9. College -->
                <div class="form-group">
                    <label>College / Institute</label>
                    <input type="text" name="college" placeholder="College Name" value="Universal Group of Management And Technology">
                </div>

                <!-- 10. School -->
                <div class="form-group">
                    <label>School</label>
                    <input type="text" name="school" placeholder="School Name" value="BHSS Sogam">
                </div>

            </div>

            <button type="submit" class="btn-submit">Complete Registration &rarr;</button>
        </form>

        <div class="bottom-links">
            <p>Already have an account? <a href="login.html">Login here</a></p>
            <p style="margin-top: 0.5rem;"><a href="index.html">&larr; Back to Front Portal</a></p>
        </div>

    </div>

    <script>
        function handleRegisterSubmit(e) {
            const form = e.target;
            const userData = {
                name: form.name.value.trim(),
                email: form.email.value.trim(),
                password: form.password.value,
                contact_no: form.contact_no.value.trim(),
                role: form.role.value,
                qualification: form.qualification.value,
                parentage: form.parentage.value.trim(),
                course_enrolled: form.course_enrolled.value.trim(),
                college: form.college ? form.college.value : "Universal Group of Management And Technology",
                school: form.school ? form.school.value : "BHSS Sogam",
                status: "active",
                login_count: 1,
                logout_count: 0,
                quiz_score: 0,
                created_at: new Date().toISOString()
            };

            // Save locally
            localStorage.setItem('user_' + userData.email, JSON.stringify(userData));
            localStorage.setItem('currentUser', JSON.stringify(userData));

            let usersList = [];
            try { usersList = JSON.parse(localStorage.getItem('all_users') || '[]'); } catch(err) {}
            usersList = usersList.filter(u => u.email !== userData.email);
            usersList.push(userData);
            localStorage.setItem('all_users', JSON.stringify(usersList));

            // Log activity locally
            let activities = [];
            try { activities = JSON.parse(localStorage.getItem('user_activities') || '[]'); } catch(err) {}
            activities.unshift({
                user_name: userData.name,
                user_email: userData.email,
                contact_no: userData.contact_no,
                role: userData.role,
                action: 'Account Registered',
                details: 'Registered as ' + userData.role + ' (' + userData.course_enrolled + ')',
                created_at: new Date().toLocaleString()
            });
            localStorage.setItem('user_activities', JSON.stringify(activities));

            // Detect if running on a live PHP server or static Live Server / file:///
            const isPhpServer = (window.location.protocol === 'http:' || window.location.protocol === 'https:') && 
                                (window.location.port === '80' || window.location.port === '8080' || window.location.port === '');

            if (!isPhpServer) {
                // Prevent navigation to register.php which renders raw code in Live Server
                e.preventDefault();

                document.getElementById('registerFormContainer').innerHTML = `
                    <div class="success-box">
                        <h2 style="font-size: 1.6rem; color: #ffffff; margin-bottom: 0.5rem;">Welcome, ${userData.name}!</h2>
                        <p style="color: #cbd5e1; font-size: 0.95rem; margin-bottom: 1.5rem;">Your account has been registered with role <strong>${userData.role}</strong>.</p>
                        <div style="background: rgba(15, 23, 42, 0.8); border: 1px solid var(--card-border); padding: 10px 14px; border-radius: 8px; font-size: 0.9rem; color: var(--accent); margin-bottom: 1.5rem;">
                            ✉️ Confirmation email dispatched to: <strong>${userData.email}</strong>
                        </div>
                        <a href="quiz.html" style="display:block;width:100%;padding:1rem;background:linear-gradient(135deg,var(--primary),var(--accent));color:#ffffff;font-weight:700;font-size:1.05rem;text-decoration:none;border-radius:10px;text-align:center;box-shadow:0 4px 15px rgba(79,70,229,0.4);margin-bottom:0.8rem;">
                            🚀 Start 4 AI Questions &amp; 20 Quiz Assessment &rarr;
                        </a>
                        <a href="dashboard.html" style="display:inline-block;color:var(--text-muted);text-decoration:none;font-size:0.9rem;padding:0.5rem 1rem;">
                            Or proceed directly to Dashboard &rarr;
                        </a>
                    </div>
                `;
                return false;
            }
        }
    </script>

</body>
</html>
